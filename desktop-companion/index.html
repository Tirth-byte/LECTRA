<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LECTRA Companion</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        padding: 12px;
        pointer-events: none;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .pointer-interactive {
        pointer-events: auto;
      }
      .companion-card {
        background: rgba(22, 22, 26, 0.88);
        backdrop-filter: blur(28px) saturate(190%);
        -webkit-backdrop-filter: blur(28px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.25);
        border-radius: 18px;
        padding: 14px 16px;
        margin-bottom: 10px;
        color: #fff;
        transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        transform-origin: top right;
      }
      .companion-card.enter {
        animation: toastEnter 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .companion-card.exit {
        animation: toastExit 0.18s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes toastEnter {
        from {
          opacity: 0;
          transform: translate3d(20px, 0, 0) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }
      @keyframes toastExit {
        from {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          opacity: 0;
          transform: translate3d(14px, 0, 0) scale(0.97);
        }
      }
      .badge-away {
        background: rgba(245, 158, 11, 0.18);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.35);
      }
      .badge-viewing {
        background: rgba(16, 185, 129, 0.18);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.35);
      }
      .badge-join {
        background: rgba(59, 130, 246, 0.18);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.35);
      }
      .badge-disconnect {
        background: rgba(239, 68, 68, 0.18);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.35);
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
