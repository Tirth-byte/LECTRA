[package]
name = "lectra-companion"
version = "0.1.0"
description = "LECTRA Faculty Desktop Alert Companion"
authors = ["Tirth Patel"]
edition = "2021"

[lib]
name = "lectra_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
